<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>دفتر مشق</title>
<style>
  :root {
    --page: #eef3fb;
    --paper: #ffffff;
    --ink: #14213d;
    --muted: #5f6f8a;
    --rule: #d3dff2;
    --cover: #14213d;
    --cover-ink: #f4f7ff;
    --margin: #d7263d;
    --mark: #ffe14d;
    --mark-ink: #3b3000;
    --ok: #178a55;
    --field: #ffffff;
    --soft: #e3ecfa;
    --shadow: 0 1px 0 rgba(20,33,61,.06), 0 10px 24px -12px rgba(20,33,61,.25);
    --sat: 62%; --lt: 40%; --bgl: 92%;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0c1322; --paper: #162036; --ink: #e8eefb; --muted: #9db0cf; --rule: #27385a;
      --cover: #0a1020; --cover-ink: #eef3ff; --margin: #ff6b7d; --mark: #e8c92a; --mark-ink: #2a2300;
      --ok: #4cc88d; --field: #101a2e; --soft: #1e2d4a; --shadow: 0 10px 24px -12px rgba(0,0,0,.6);
      --sat: 55%; --lt: 68%; --bgl: 24%;
    }
  }

  /* ---- تقویم شمسی ---- */
  [hidden] { display: none !important; }
  .datebtn {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font: inherit; font-weight: normal; text-align: right; color: var(--ink); background: var(--field);
    border: 2px solid var(--rule); border-radius: 12px; padding: 10px 12px; min-height: 48px; cursor: pointer;
  }
  .datebtn .ph { color: var(--muted); }
  .cal { margin-top: 8px; padding: 10px; background: var(--field); border: 2px solid var(--rule); border-radius: 14px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-head button {
    width: 44px; height: 44px; font-size: 24px; line-height: 1; border-radius: 12px; padding: 0;
    background: var(--soft); color: var(--ink); border: 0; cursor: pointer; font-family: inherit;
  }
  .cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal-week span { font-size: 12.5px; color: var(--muted); padding: 2px 0 4px; }
  .cal-week span:last-child { color: var(--margin); }
  .cd {
    height: 42px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: var(--ink);
    font: inherit; font-size: 15px; cursor: pointer;
  }
  .cd.fri { color: var(--margin); }
  .cd.today { background: var(--mark); color: var(--mark-ink); font-weight: bold; }
  .cd.sel { box-shadow: inset 0 0 0 2px var(--margin); font-weight: bold; }
  .cd:focus-visible, .cal-head button:focus-visible, .datebtn:focus-visible { outline: 3px solid var(--margin); outline-offset: 2px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: "Vazirmatn", "Noto Sans Arabic", Tahoma, system-ui, sans-serif; line-height: 1.9;
    padding-bottom: env(safe-area-inset-bottom);
  }
  main { max-width: 560px; margin: 0 auto; padding: 0 0 80px; }
  h1, h2, h3, p { margin: 0; }
  button { font: inherit; cursor: pointer; border: 0; color: inherit; background: none; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 3px solid var(--margin); outline-offset: 2px;
  }
  svg { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }

  #bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--mark); transform-origin: right; transform: scaleX(0); opacity: 0; transition: transform .6s ease, opacity .3s; z-index: 50; }
  body.busy #bar { opacity: 1; transform: scaleX(.8); }

  /* جلد دفتر */
  .cover {
    background: var(--cover); color: var(--cover-ink);
    padding: 16px 16px 30px; border-radius: 0 0 26px 26px; position: relative;
  }
  .cover::after {
    content: ""; position: absolute; inset-inline: 22px; bottom: 10px; height: 0;
    border-bottom: 2px dashed rgba(244,247,255,.25);
  }
  .cover-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; }
  .brand { font-weight: bold; font-size: 15px; opacity: .9; }
  .chip-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 99px;
    background: rgba(244,247,255,.12); color: var(--cover-ink); font-size: 14px;
  }
  .chip-btn:active { background: rgba(244,247,255,.25); }
  .label {
    background: #fbfdff; color: #14213d; border-radius: 6px; margin: 16px 6px 0; padding: 12px 16px 14px;
    box-shadow: 0 6px 0 -2px rgba(0,0,0,.25);
    background-image: repeating-linear-gradient(transparent 0 33px, #c9d8f0 33px 34px);
    background-position: 0 6px;
  }
  .label small { display: block; font-size: 13px; color: #5f6f8a; line-height: 1.5; }
  .label h1 { font-size: 26px; line-height: 1.5; word-break: break-word; }
  .label h1 mark { background: var(--mark); color: var(--mark-ink); padding: 0 8px; border-radius: 4px; }
  .sub { margin-top: 12px; font-size: 14px; opacity: .85; text-align: center; }

  .wrap { padding: 18px 14px 0; }

  /* دفتر (برگه‌ی خط‌دار با حاشیه‌ی قرمز) */
  .sheet {
    position: relative; background: var(--paper); border-radius: 6px 6px 14px 14px; box-shadow: var(--shadow);
    padding: 6px 0 4px; margin-top: 14px; overflow: hidden;
  }
  .sheet::before {
    content: ""; position: absolute; top: 0; bottom: 0; right: 52px; width: 2px; background: var(--margin); opacity: .55;
  }
  .day {
    display: flex; align-items: center; gap: 8px; padding: 12px 64px 4px 14px; font-weight: bold; font-size: 14px; color: var(--muted);
  }
  .day.today { color: var(--margin); }
  .day .n { background: var(--soft); border-radius: 99px; padding: 0 9px; font-size: 12px; color: var(--muted); }
  .entry {
    display: grid; grid-template-columns: 52px 1fr; align-items: start;
    border-bottom: 1px dashed var(--rule); padding: 10px 0 12px;
    --c: hsl(var(--h, 220) var(--sat) var(--lt));
    --cb: hsl(var(--h, 220) 70% var(--bgl));
  }
  .entry:last-child { border-bottom: 0; }
  .margin { display: flex; justify-content: center; padding-top: 4px; }
  .tick {
    width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--rule); display: grid; place-items: center;
    color: transparent; background: var(--paper);
  }
  .tick:active { transform: scale(.92); }
  .entry.done .tick { background: var(--ok); border-color: var(--ok); color: #fff; }
  .entry.done .body, .entry.done .subj { opacity: .5; }
  .entry.done .body { text-decoration: line-through; }
  .entry.past:not(.done) .when { text-decoration: line-through; }
  .content { padding: 0 14px 0 14px; min-width: 0; }
  .subj { display: inline-block; background: var(--cb); color: var(--c); font-weight: bold; border-radius: 5px; padding: 0 10px; border-inline-start: 4px solid var(--c); }
  .body { white-space: pre-wrap; margin: 4px 0 2px; word-break: break-word; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; font-size: 13px; }
  .when { color: var(--muted); }
  .when.hot { color: var(--margin); font-weight: bold; }
  .link { color: var(--c); font-weight: bold; text-decoration: none; display: inline-flex; gap: 4px; align-items: center; }
  .acts { display: flex; gap: 8px; margin-top: 8px; }

  .note {
    background: var(--mark); color: var(--mark-ink); border-radius: 4px; padding: 12px 16px; margin: 0 6px;
    transform: rotate(-.6deg); box-shadow: 0 8px 14px -10px rgba(0,0,0,.5);
  }
  .note b { display: block; font-size: 13px; opacity: .75; }
  .note p { white-space: pre-wrap; }

  /* پیشرفت */
  .progress { margin-top: 16px; }
  .progress .row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .track { height: 10px; background: rgba(244,247,255,.18); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; background: var(--mark); border-radius: 99px; transition: width .5s ease; }

  /* فیلترها */
  .seg { display: flex; background: var(--soft); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; padding: 6px 0; border-radius: 9px; font-size: 14px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: bold; box-shadow: 0 1px 3px rgba(20,33,61,.15); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex: none; padding: 3px 13px; border-radius: 99px; font-size: 14px; border: 2px solid var(--rule); background: var(--paper); color: var(--ink);
  }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chips.small button { font-size: 13px; padding: 0 11px; }

  /* فرم‌ها و دکمه‌ها */
  .panel { background: var(--paper); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; margin-top: 14px; }
  .panel h2 { font-size: 18px; margin-bottom: 2px; }
  label { display: block; font-size: 14px; margin: 12px 0 4px; color: var(--muted); }
  input, textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--field);
    border: 2px solid var(--rule); border-radius: 10px; padding: 9px 12px;
  }
  textarea { min-height: 92px; resize: vertical; }
  input.code { direction: ltr; text-align: center; font-size: 24px; letter-spacing: 6px; font-weight: bold; }
  .ltr { direction: ltr; text-align: left; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: bold; padding: 11px 20px; border-radius: 12px; background: var(--ink); color: var(--paper); }
  .btn.block { width: 100%; margin-top: 16px; }
  .btn.ghost { background: transparent; border: 2px solid var(--rule); color: var(--ink); }
  .btn.red { background: transparent; border: 2px solid var(--margin); color: var(--margin); }
  .btn.sm { padding: 3px 13px; font-size: 14px; border-radius: 8px; }
  .btn:active { transform: scale(.98); }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .row > * { flex: 1; }
  .tabs { display: flex; margin: 0 6px; gap: 6px; }
  .tabs button { flex: 1; padding: 10px; border-radius: 12px 12px 0 0; background: rgba(244,247,255,.1); color: var(--cover-ink); font-weight: bold; }
  .tabs button[aria-selected="true"] { background: var(--page); color: var(--ink); }
  .codebox { text-align: center; border: 2px dashed var(--rule); border-radius: 12px; padding: 10px; margin-top: 12px; }
  .codebox b { display: block; font-size: 34px; letter-spacing: 8px; direction: ltr; line-height: 1.4; }
  .muted { color: var(--muted); font-size: 14px; }
  .empty { text-align: center; padding: 34px 20px; color: var(--muted); }
  .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
  .choose { display: grid; gap: 12px; margin-top: 8px; }
  .choose button {
    text-align: start; padding: 16px; border-radius: 14px; background: var(--paper); box-shadow: var(--shadow);
    display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center;
  }
  .choose .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--mark); color: var(--mark-ink); font-size: 22px; }
  .choose b { font-size: 17px; display: block; }
  .choose small { color: var(--muted); }
  .banner { margin: 12px 14px 0; padding: 10px 14px; border-radius: 10px; background: var(--soft); color: var(--ink); font-size: 14px; border-inline-start: 4px solid var(--margin); }
  select {
    width: 100%; font: inherit; color: var(--ink); background: var(--field);
    border: 2px solid var(--rule); border-radius: 10px; padding: 9px 12px; min-height: 48px;
  }
  select:focus-visible { outline: 3px solid var(--margin); outline-offset: 2px; }
  .hint { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; color: var(--muted); background: var(--soft); border-radius: 10px; padding: 8px 12px; margin: 0 0 14px; }
  .hint svg { flex: none; margin-top: 5px; }
  .roster { margin-top: 12px; border-top: 1px dashed var(--rule); }
  .rrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px dashed var(--rule); }
  .rname { flex: 1 1 140px; font-weight: bold; word-break: break-word; }
  .rpin { font-size: 18px; letter-spacing: 3px; min-width: 76px; text-align: center; background: var(--soft); border-radius: 8px; padding: 0 8px; }
  .rep-card { border-top: 1px dashed var(--rule); margin-top: 14px; padding-top: 10px; --c: hsl(var(--h, 220) var(--sat) var(--lt)); --cb: hsl(var(--h, 220) 70% var(--bgl)); }
  .rep-text { margin-top: 4px; word-break: break-word; }
  .rep-nums { display: flex; gap: 16px; flex-wrap: wrap; margin: 6px 0; font-size: 14px; }
  .rep-nums b { font-size: 18px; }
  details.rep { margin-top: 6px; background: var(--soft); border-radius: 10px; padding: 4px 12px; }
  details.rep summary { cursor: pointer; padding: 4px 0; font-size: 14px; font-weight: bold; }
  details.rep p { padding: 2px 0 8px; font-size: 14px; word-break: break-word; }
  .arow { padding: 11px 0; border-bottom: 1px dashed var(--rule); }
  .ahead { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .achips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
  .cchip { display: inline-flex; align-items: center; gap: 4px; background: var(--soft); border-radius: 99px; padding: 0 4px 0 10px; font-size: 13px; }
  .cchip button { width: 26px; height: 26px; border-radius: 50%; font-size: 16px; line-height: 1; color: var(--muted); }
  .cchip button:focus-visible { outline: 3px solid var(--margin); outline-offset: 1px; }
  #toast {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translate(-50%, 30px);
    background: var(--ink); color: var(--paper); padding: 10px 20px; border-radius: 99px; font-size: 14px; max-width: 90%;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 60; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { background: var(--margin); color: #fff; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="bar"></div>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// ================= تنظیمات Supabase (این دو مقدار رو عوض کن) =================
const SUPABASE = {
  url: 'https://baulcrhlclcninkncfzq.supabase.co',
  key: 'sb_publishable_kubd6Fmvf8SPGchOAC5vSg_gwlmbhdb'
};

// ================= ذخیره‌سازی =================
const mem = {};
const configured = !SUPABASE.url.startsWith('PASTE') && !SUPABASE.key.startsWith('PASTE');
const API = SUPABASE.url.replace(/\/+$/, '') + '/rest/v1/classes';
const authHeaders = () => {
  const h = { apikey: SUPABASE.key };
  if (SUPABASE.key.startsWith('eyJ')) h.Authorization = 'Bearer ' + SUPABASE.key;
  return h;
};
const docId = key => key.replace(/[^a-zA-Z0-9]/g, '_');

const store = {
  async get(key, shared) {
    if (!shared) {
      try { const v = localStorage.getItem(key); if (v) return JSON.parse(v); } catch (e) {}
      return mem['local:' + key] ? JSON.parse(mem['local:' + key]) : null;
    }
    if (!configured) return mem[key] ? JSON.parse(mem[key]) : null;
    try {
      const r = await fetch(`${API}?id=eq.${docId(key)}&select=data`, { headers: authHeaders() });
      if (!r.ok) return undefined;
      const rows = await r.json();
      return rows.length ? rows[0].data : null;
    } catch (e) { return undefined; }
  },
  async set(key, val, shared) {
    if (!shared) {
      mem['local:' + key] = JSON.stringify(val);
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
      return true;
    }
    if (!configured) { mem[key] = JSON.stringify(val); return true; }
    try {
      const r = await fetch(`${API}?on_conflict=id`, {
        method: 'POST',
        headers: { ...authHeaders(), 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify({ id: docId(key), data: val })
      });
      return r.ok;
    } catch (e) { return false; }
  },
  // همه‌ی ردیف‌هایی که کلیدشون با prefix شروع میشه (برای گزارش معلم)
  async list(prefix) {
    if (!configured) return Object.keys(mem).filter(k => k.startsWith(prefix)).map(k => ({ key: k, data: JSON.parse(mem[k]) }));
    try {
      const r = await fetch(`${API}?id=like.${encodeURIComponent(docId(prefix))}*&select=id,data`, { headers: authHeaders() });
      if (!r.ok) return undefined;
      return (await r.json()).map(x => ({ key: x.id, data: x.data }));
    } catch (e) { return undefined; }
  }
};

async function hash(s) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mashgh:' + s));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { return 'plain:' + s; }
}

// ================= ابزارها =================
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toFa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const normCode = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
const ALPHA = 'abcdefghjkmnpqrstuvwxyz23456789';
const genCode = () => Array.from({ length: 5 }, () => ALPHA[Math.floor(Math.random() * ALPHA.length)]).join('');
const val = id => (document.getElementById(id) || {}).value || '';
const DEFAULT_SUBJECTS = ['ریاضی', 'فارسی', 'علوم', 'اجتماعی', 'قرآن', 'انگلیسی'];
const faToEn = s => String(s).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const genPin = () => String(Math.floor(Math.random() * 10000)).padStart(4, '0');
const fmtTime = ts => new Date(ts).toLocaleString('fa-IR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });

const IC = {
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg>',
  link: '<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>',
  refresh: '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 10-2.5 5.8"/><path d="M20 5v5h-5"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  out: '<svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/></svg>',
  pencil: '<svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 012.8 0l.2.2a2 2 0 010 2.8L8 19z"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  book: '<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/></svg>',
  teacher: '<svg viewBox="0 0 24 24"><path d="M3 5h18v11H3z"/><path d="M8 20h8M12 16v4"/><path d="M7 9h6M7 12h4"/></svg>'
};

function toast(text, err) {
  const t = document.getElementById('toast');
  t.textContent = text; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2600);
}

async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); return; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(okMsg); } catch (e) { toast('کپی نشد. دستی کپی کن: ' + text, true); }
  ta.remove();
}

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function dayDiff(d) {
  if (!d) return null;
  const [y, m, day] = d.split('-').map(Number);
  const now = new Date(); now.setHours(0, 0, 0, 0);
  return Math.round((new Date(y, m - 1, day) - now) / 86400000);
}
function faDate(d) {
  const [y, m, day] = d.split('-').map(Number);
  return new Date(y, m - 1, day).toLocaleDateString('fa-IR', { weekday: 'long', day: 'numeric', month: 'long' });
}
function whenText(d) {
  const df = dayDiff(d);
  if (df === null) return { t: '', hot: false };
  if (df < 0) return { t: 'مهلتش تموم شده (' + faDate(d) + ')', hot: false };
  if (df === 0) return { t: 'تحویل: امروز', hot: true };
  if (df === 1) return { t: 'تحویل: فردا', hot: true };
  return { t: 'تحویل: ' + faDate(d), hot: false };
}

// ================= تقویم شمسی =================
const JP = (() => { try { return new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn', { year: 'numeric', month: 'numeric', day: 'numeric' }); } catch (e) { return null; } })();
function jparts(d) { const o = {}; JP.formatToParts(d).forEach(p => { if (p.type !== 'literal') o[p.type] = parseInt(p.value, 10); }); return o; }
const jalaliOK = (() => { try { const p = jparts(new Date(2026, 10, 1, 12)); return p.year === 1405 && p.month === 8; } catch (e) { return false; } })();
function monthStart(d) { const p = jparts(d); const s = new Date(d); s.setHours(12, 0, 0, 0); s.setDate(s.getDate() - (p.day - 1)); return s; }
function monthLen(start) { const m = jparts(start).month; let n = 0; const t = new Date(start); while (jparts(t).month === m && n < 32) { n++; t.setDate(t.getDate() + 1); } return n; }
function shiftMonth(start, dir) { const t = new Date(start); t.setDate(t.getDate() + (dir > 0 ? monthLen(start) : -1)); return monthStart(t); }
function fromIso(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d, 12); }
const fullFa = iso => fromIso(iso).toLocaleDateString('fa-IR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
let calStart = null;

function dueField(v) {
  if (!jalaliOK) return `<input id="due" type="date" value="${esc(v)}">`;
  return `<input id="due" type="hidden" value="${esc(v)}">
    <button type="button" class="datebtn" id="duebtn" data-act="due-open" aria-expanded="false" aria-controls="cal">
      <span id="duetxt" class="${v ? '' : 'ph'}">${v ? esc(fullFa(v)) : 'انتخاب تاریخ'}</span><span aria-hidden="true">▾</span>
    </button>
    <div id="cal" class="cal" hidden></div>`;
}
function syncDueLabel() {
  const t = document.getElementById('duetxt'); if (!t) return;
  const v = val('due');
  t.textContent = v ? fullFa(v) : 'انتخاب تاریخ';
  t.className = v ? '' : 'ph';
}
function renderCal() {
  const box = document.getElementById('cal'); if (!box || !calStart) return;
  const len = monthLen(calStart), lead = (calStart.getDay() + 1) % 7;
  const sel = val('due'), today = ymd(new Date());
  const title = calStart.toLocaleDateString('fa-IR-u-ca-persian', { month: 'long', year: 'numeric' });
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span></span>';
  for (let i = 0; i < len; i++) {
    const d = new Date(calStart); d.setDate(d.getDate() + i);
    const iso = ymd(d), col = (lead + i) % 7;
    cells += `<button type="button" class="cd${col === 6 ? ' fri' : ''}${iso === today ? ' today' : ''}${iso === sel ? ' sel' : ''}" data-act="cal-day" data-iso="${iso}" aria-label="${esc(fullFa(iso))}">${toFa(i + 1)}</button>`;
  }
  box.innerHTML = `<div class="cal-head">
      <button type="button" data-act="cal-prev" aria-label="ماه قبل">›</button><b>${esc(title)}</b>
      <button type="button" data-act="cal-next" aria-label="ماه بعد">‹</button></div>
    <div class="cal-week">${['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'].map(x => `<span>${x}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>`;
}
const hueOf = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '';

function groupOf(h) {
  const df = dayDiff(h.due);
  if (df === null) return 5;
  if (df < 0) return 6;
  if (df === 0) return 1;
  if (df === 1) return 2;
  if (df <= 7) return 3;
  return 4;
}
const GROUP_NAMES = { 1: 'امروز', 2: 'فردا', 3: 'این هفته', 4: 'بعداً', 5: 'بدون مهلت', 6: 'مهلت‌های گذشته' };

const sortHw = list => [...list].sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || b.created - a.created);

  const w = whenText(h.due);
  const isDone = !teacher && doneSet.has(h.id);

  const url = safeUrl(h.link || '');
  return `<div class="entry ${isDone ? 'done' : ''} ${past ? 'past' : ''}" style="--h:${hueOf(h.subject)}">
    <div class="margin">${teacher ? '' : `<button class="tick" data-act="toggle" data-id="${h.id}" aria-pressed="${isDone}" aria-label="انجام شد">${IC.check}</button>`}</div>

}

// ================= داده =================
async function openClass(code, silent) {
  const data = await store.get('class:' + code, true);
  if (!data) {
    if (!silent) { cls = null; toast(data === undefined ? 'اتصال به اینترنت برقرار نشد. دوباره امتحان کن.' : 'کلاسی با این کد پیدا نشد. کد رو دوباره چک کن.', true); }
    return false;
  }
  cls = { ...data, code, homework: data.homework || [], students: data.students || [] };
  lastSync = Date.now();
  return true;
}

async function saveClass() {
  const { code, ...data } = cls;
  const ok = await store.set('class:' + code, data, true);
  if (!ok) toast('ذخیره نشد. اینترنت رو چک کن و دوباره امتحان کن.', true);
  return ok;
}

async function busy(fn) {
  document.body.classList.add('busy');
  try { return await fn(); } finally { document.body.classList.remove('busy'); }
}

async function enterStudent(code) {
  studentCode = code; view = 'student'; student = null;
  if (await openClass(code)) {
    doneSet = await loadDone(code);
    lastCode = code; await store.set('last-code', code, false);
    if (cls.students.length) {
      const saved = await store.get('stu:' + code, false);
      const me = saved && cls.students.find(x => x.id === saved.id && String(x.pin) === String(saved.pin));
      if (me) { student = { id: me.id, name: me.name }; await syncActivity(); }
    }
  }
  render();
}

const actKey = () => `act:${cls.code}:${student.id}`;
async function syncActivity() {
  if (!student || !cls) return;
  const act = await store.get(actKey(), true);
  if (act === undefined) return;               // اینترنت قطع بود، چیزی ننویس
  const a = act || { seen: {}, done: {}, last: 0 };
  a.seen = a.seen || {}; a.done = a.done || {};
  const now = Date.now();
  let changed = !act;
  cls.homework.forEach(h => { if (!a.seen[h.id]) { a.seen[h.id] = now; changed = true; } });
  if (now - (a.last || 0) > 30 * 60 * 1000) changed = true;
  doneSet = new Set(Object.keys(a.done));
  if (changed) { a.last = now; await store.set(actKey(), a, true); }
}

      + (hws.length ? hws.map(h => {
        const seen = st.filter(x => rows[x.id] && rows[x.id].seen && rows[x.id].seen[h.id]);
        const unseen = st.filter(x => !seen.includes(x));

    await openClass(session.code, true);
    if (editId) {
      const h = cls.homework.find(x => x.id === editId);
      if (h) Object.assign(h, { subject, text, due, link });
    } else {
      cls.homework.push({ id: Date.now().toString(36), subject, text, due, link, created: Date.now() });
    }
    const wasEdit = !!editId;
    if (await saveClass()) { toast(wasEdit ? 'تغییرات ذخیره شد' : 'مشق ثبت شد'); editId = null; render(); }
  }),

  'edit': el => { editId = el.dataset.id; render(); document.getElementById('form').scrollIntoView(); },
  'cancel-edit': () => { editId = null; render(); },

  'del': el => busy(async () => {
    if (!confirm('این مشق حذف بشه؟')) return;
    await openClass(session.code, true);
    cls.homework = cls.homework.filter(h => h.id !== el.dataset.id);
    if (await saveClass()) toast('مشق حذف شد');
    render();
  }),

  'save-notice': () => busy(async () => {
    const notice = val('notice').trim();
    await openClass(session.code, true);
    cls.notice = notice;
    if (await saveClass()) toast(notice ? 'اطلاعیه ذخیره شد' : 'اطلاعیه پاک شد');
    render();
  }),

  'toggle-roster': () => { rosterOpen = !rosterOpen; render(); },
  'copy-pins': () => copyText((cls.students || []).map(x => x.acct
      ? `نام: ${x.name}  |  نام کاربری: ${x.acct}` + (x.pw ? `  |  رمز: ${x.pw}` : '')
      : `نام: ${x.name}  |  رمز: ${toFa(x.pin)}`).join('\n'), 'لیست کپی شد'),

  'add-students': () => busy(async () => {
    const names = val('newnames').split('\n').map(x => x.trim().replace(/\s+/g, ' ')).filter(Boolean);
    if (!names.length) return toast('اول اسم‌ها رو بنویس.', true);
    await openClass(session.code, true);
    const code = session.code;
    const have = new Set(cls.students.map(x => x.name));
    let counter = cls.acctCounter || 0, skipped = 0;
    const added = [];
    for (const n of names) {
      if (n.length > 40 || have.has(n)) { skipped++; continue; }
      let u, e;
      do {
        counter++; u = code + String(counter).padStart(2, '0');
        e = await store.get('acct:' + u, true);
        if (e === undefined) return toast('اتصال به اینترنت برقرار نشد.', true);
      } while (e);
      const pw = randStr(6);
      const ok = await store.set('acct:' + u, { name: n, pw: await acctHash(u, pw), classes: [code], created: Date.now() }, true);
      if (!ok) { toast('ساخت حساب «' + n + '» ناموفق بود.', true); break; }
      have.add(n); added.push({ id: 'a' + u, name: n, pin: '', acct: u, pw });
    }
    if (!added.length) { if (skipped) toast('این اسم‌ها قبلاً توی لیست بودن.', true); return; }
    cls.acctCounter = counter;
    cls.students.push(...added);
    if (await saveClass()) { rosterOpen = true; toast(toFa(added.length) + ' حساب ساخته شد'); render(); }
  }),

  'new-pin': el => busy(async () => {
    await openClass(session.code, true);
    const me = cls.students.find(x => x.id === el.dataset.id);
    if (!me) return;
    if (me.acct) {
      const a = await store.get('acct:' + me.acct, true);
      if (!a || a.deleted) return toast('حساب پیدا نشد.', true);
      const pw = randStr(6);
      a.pw = await acctHash(me.acct, pw);
      if (!(await store.set('acct:' + me.acct, a, true))) return toast('ذخیره نشد.', true);
      me.pw = pw;
    } else {
      me.pin = genPin();
    }
    if (await saveClass()) { toast('رمز جدید ساخته شد'); render(); }
  }),

  'del-student': el => busy(async () => {
    if (!confirm('این دانش‌آموز از لیست حذف بشه؟')) return;
    await openClass(session.code, true);
    const gone = cls.students.find(x => x.id === el.dataset.id);
    cls.students = cls.students.filter(x => x.id !== el.dataset.id);
    if (await saveClass()) {
      if (gone && gone.acct) {
        const a = await store.get('acct:' + gone.acct, true);
        if (a) { a.classes = (a.classes || []).filter(c => c !== session.code); await store.set('acct:' + gone.acct, a, true); }
      }
      toast('حذف شد'); render();
    }
  }),

  'load-report': () => busy(async () => {
    const list = await store.list(`act:${session.code}:`);
    if (list === undefined) return toast('گزارش دریافت نشد. اینترنت رو چک کن.', true);
    const rows = {};
    list.forEach(x => { rows[x.key.split(/[:_]/).pop()] = x.data; });
    await openClass(session.code, true);
    report = { rows, at: Date.now() };
    render();
    const el = document.getElementById('report'); if (el) el.scrollIntoView();
  }),

  // ----- حساب دانش‌آموز -----
  'goto-acct-login': () => { cls = null; student = null; view = 'student'; render(); },
  'acct-login': () => busy(async () => {
    const u = normCode(val('au')), pw = faToEn(val('apw'));
    if (!u || !pw) return toast('نام کاربری و رمز رو بنویس.', true);
    const d = await store.get('acct:' + u, true);
    if (d === undefined) return toast('اتصال به اینترنت برقرار نشد. دوباره امتحان کن.', true);
    const h = await acctHash(u, pw);
    if (!d || d.deleted || d.pw !== h) return toast('نام کاربری یا رمز اشتباهه.', true);
    await store.set('acct-auth', { u, pw: h }, false);
    acct = { u, name: d.name, classes: d.classes || [] };
    await loadMyClasses();
    view = 'student'; cls = null; student = null; render();
  }),
  'acct-logout': () => { store.set('acct-auth', null, false); acct = null; cls = null; student = null; myClasses = []; view = 'home'; render(); },
  'my-refresh': () => busy(async () => {
    const d = await store.get('acct:' + acct.u, true);
    if (d === undefined) return toast('اتصال به اینترنت برقرار نشد.', true);
    if (!d || d.deleted) { toast('این حساب دیگه وجود نداره.', true); return actions['acct-logout'](); }
    acct.classes = d.classes || [];
    await loadMyClasses();
    toast('به‌روز شد'); render();
  }),
  'open-my-class': el => busy(() => enterAccountClass(el.dataset.c)),

  // ----- مدیریت برنامه -----
  'go-admin': () => busy(async () => {
    const d = await store.get('admin:main', true);
    if (d === undefined) return toast('اتصال به اینترنت برقرار نشد. دوباره امتحان کن.', true);
    adminSetup = !d; view = 'adminAuth'; render();
  }),
  'admin-setup': () => busy(async () => {
    const pw = val('adpw');
    if (pw.length < 6) return toast('رمز مدیریت باید حداقل ۶ حرف باشه.', true);
    const d = await store.get('admin:main', true);
    if (d !== null) return toast(d === undefined ? 'اتصال برقرار نشد.' : 'رمز مدیریتیت قبلاً ساخته شده.', true);
    if (!(await store.set('admin:main', { pw: await hash('admin:' + pw), counter: 1000 }, true))) return toast('ذخیره نشد. اینترنت رو چک کن.', true);
    admin = true; await loadAdminData(); view = 'admin'; render(); toast('رمز مدیریتیت ساخته شد');
  }),
  'admin-login': () => busy(async () => {
    const d = await store.get('admin:main', true);
    if (!d) return toast(d === undefined ? 'اتصال به اینترنت برقرار نشد.' : 'هنوز رمز مدیریتیت ساخته نشده.', true);
    if (d.pw !== (await hash('admin:' + val('adpw')))) return toast('رمز اشتباهه.', true);
    admin = true;
    if (await loadAdminData()) { view = 'admin'; render(); }
  }),
  'admin-logout': () => { admin = false; accts = []; allClasses = []; lastCreds = []; lastClassPw = null; view = 'home'; render(); },
  'admin-reload': () => busy(async () => { if (await loadAdminData()) { toast('به‌روز شد'); render(); } }),
  'hide-creds': () => { lastCreds = []; render(); },
  'hide-class-pw': () => { lastClassPw = null; render(); },
  'copy-class-pw': () => copyText(`کلاس: ${lastClassPw.name}\nکد کلاس: ${lastClassPw.code}\nرمز معلم: ${lastClassPw.pw}`, 'کپی شد'),
  'class-newpw': el => busy(async () => {
    const code = el.dataset.c;
    if (!confirm('رمز معلم این کلاس عوض بشه؟ رمز قبلی دیگه کار نمی‌کنه.')) return;
    const d = await store.get('class:' + code, true);
    if (!d) return toast(d === undefined ? 'اتصال به اینترنت برقرار نشد.' : 'کلاس پیدا نشد.', true);
    const pw = randStr(6);
    d.pw = await hash(pw);
    if (!(await store.set('class:' + code, d, true))) return toast('ذخیره نشد.', true);
    lastClassPw = { name: d.name, code, pw };
    render(); toast('رمز جدید ساخته شد');
    const c = document.getElementById('classpw'); if (c) c.scrollIntoView();
  }),
  'copy-creds': () => copyText(lastCreds.map(x => `نام: ${x.name}  |  نام کاربری: ${x.u}  |  رمز: ${x.pw}`).join('\n'), 'کپی شد'),

  'admin-create': () => busy(async () => {
    const lines = val('anames').split('\n').map(x => x.trim()).filter(Boolean);
    if (!lines.length) return toast('اول اسم‌ها رو بنویس.', true);
    const clsCode = val('acls');
    const adm = await store.get('admin:main', true);
    if (!adm) return toast('اتصال به اینترنت برقرار نشد.', true);
    let classDoc = null;
    if (clsCode) {
      classDoc = await store.get('class:' + clsCode, true);
      if (!classDoc) return toast('کلاس پیدا نشد. لیست رو به‌روزرسانی کن.', true);
    }
    const existing = new Set(accts.map(a => a.u));
    let counter = adm.counter || 1000;
    const items = [];
    for (const line of lines) {
      const p = line.split(/[,،\t]/).map(x => x.trim());
      const name = p[0].replace(/\s+/g, ' ');
      if (!name || name.length > 40) return toast('اسم معتبر نیست: ' + line, true);
      let u, pw;
      if (p.length >= 3) {
        u = p[1].toLowerCase(); pw = faToEn(p[2]);
        if (!/^[a-z0-9]{3,20}$/.test(u)) return toast('نام کاربری باید ۳ تا ۲۰ حرف انگلیسی یا عدد باشه: ' + p[1], true);
        if (existing.has(u)) return toast('این نام کاربری قبلاً هست: ' + u, true);
        if (pw.length < 4) return toast('رمز باید حداقل ۴ حرف باشه: ' + name, true);
      } else {
        do { counter++; u = 'u' + counter; } while (existing.has(u));
        pw = randStr(6);
      }
      existing.add(u); items.push({ name, u, pw });
    }
    const saved = await Promise.all(items.map(async it => store.set('acct:' + it.u, {
      name: it.name, pw: await acctHash(it.u, it.pw), classes: clsCode ? [clsCode] : [], created: Date.now()
    }, true)));
    if (saved.some(ok => !ok)) return toast('بعضی حساب‌ها ذخیره نشد. لیست رو به‌روزرسانی کن و دوباره امتحان کن.', true);
    adm.counter = counter; await store.set('admin:main', adm, true);
    if (clsCode) {
      classDoc.students = classDoc.students || [];
      items.forEach(it => classDoc.students.push({ id: 'a' + it.u, name: it.name, pin: '', acct: it.u }));
      await store.set('class:' + clsCode, classDoc, true);
    }
    lastCreds = items; newClsSel = clsCode;
    await loadAdminData();
    render(); toast(toFa(items.length) + ' حساب ساخته شد');
    const el = document.getElementById('creds'); if (el) el.scrollIntoView();
  }),

  'acct-addcls': el => busy(async () => {
    const u = el.dataset.u, code = val('addcls');
    if (!code) return toast('اول کلاس رو از بالای لیست انتخاب کن.', true);
    const a = await store.get('acct:' + u, true), d = await store.get('class:' + code, true);
    if (!a || a.deleted || !d) return toast('حساب یا کلاس پیدا نشد.', true);
    a.classes = a.classes || []; d.students = d.students || [];
    if (!a.classes.includes(code)) a.classes.push(code);
    if (!d.students.some(x => x.id === 'a' + u)) d.students.push({ id: 'a' + u, name: a.name, pin: '', acct: u });
    if (!(await store.set('acct:' + u, a, true)) || !(await store.set('class:' + code, d, true))) return toast('ذخیره نشد.', true);
    const row = accts.find(x => x.u === u); if (row) row.classes = a.classes;
    toast('اضافه شد'); renderAcctList();
  }),
  'acct-rmcls': el => busy(async () => {
    const u = el.dataset.u, code = el.dataset.c;
    const a = await store.get('acct:' + u, true), d = await store.get('class:' + code, true);
    if (!a) return toast('حساب پیدا نشد.', true);
    a.classes = (a.classes || []).filter(c => c !== code);
    if (!(await store.set('acct:' + u, a, true))) return toast('ذخیره نشد.', true);
    if (d) { d.students = (d.students || []).filter(x => x.id !== 'a' + u); await store.set('class:' + code, d, true); }
    const row = accts.find(x => x.u === u); if (row) row.classes = a.classes;
    toast('از کلاس حذف شد'); renderAcctList();
  }),
  'acct-newpw': el => busy(async () => {
    const u = el.dataset.u;
    const a = await store.get('acct:' + u, true);
    if (!a || a.deleted) return toast('حساب پیدا نشد.', true);
    const pw = randStr(6);
    a.pw = await acctHash(u, pw);
    if (!(await store.set('acct:' + u, a, true))) return toast('ذخیره نشد.', true);
    lastCreds = [{ name: a.name, u, pw }];
    render(); toast('رمز جدید ساخته شد');
    const c = document.getElementById('creds'); if (c) c.scrollIntoView();
  }),
  'acct-del': el => busy(async () => {
    const u = el.dataset.u;
    if (!confirm('این حساب حذف بشه؟ از همه‌ی کلاس‌ها هم برداشته میشه.')) return;
    const a = await store.get('acct:' + u, true);
    if (!a) return toast('حساب پیدا نشد.', true);
    for (const code of (a.classes || [])) {
      const d = await store.get('class:' + code, true);
      if (d) { d.students = (d.students || []).filter(x => x.id !== 'a' + u); await store.set('class:' + code, d, true); }
    }
    a.deleted = true; a.classes = [];
    if (!(await store.set('acct:' + u, a, true))) return toast('ذخیره نشد.', true);
    accts = accts.filter(x => x.u !== u);
    toast('حساب حذف شد'); render();
  })
};

$app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && actions[el.dataset.act]) actions[el.dataset.act](el);
});
$app.addEventListener('input', e => { if (e.target.id === 'acctfilter') { acctFilter = e.target.value; renderAcctList(); } });
$app.addEventListener('change', e => {
  if (e.target.id === 'addcls') addClsSel = e.target.value;
  if (e.target.id === 'acls') newClsSel = e.target.value;
});

// به‌روزرسانی خودکار نداریم: فقط وقتی دانش‌آموز دکمه‌ی «به‌روزرسانی» رو بزنه، مشق‌ها دوباره خونده میشن.

// ================= شروع =================
(async () => {
  lastCode = (await store.get('last-code', false)) || '';
  let c = '';
  try { c = normCode(new URLSearchParams(location.search).get('c') || ''); } catch (e) {}
  render();
  busy(async () => {
    const saved = await store.get('acct-auth', false);
    if (saved && saved.u) {
      const d = await store.get('acct:' + saved.u, true);
      if (d && !d.deleted && d.pw === saved.pw) {
        acct = { u: saved.u, name: d.name, classes: d.classes || [] };
        view = 'student';
        await loadMyClasses();
        if (c && acct.classes.includes(c)) return enterAccountClass(c);
        return render();
      }
    }
    if (c) return enterStudent(c);
  });
})();
</script>
</body>
</html>
