<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>دفتر مشق</title>
<style>
  :root {
    --page: #eef3fb;
    --paper: #ffffff;
    --ink: #14213d;
    --muted: #5f6f8a;
    --rule: #d3dff2;
    --cover: #14213d;
    --cover-ink: #f4f7ff;
    --margin: #d7263d;
    --mark: #ffe14d;
    --mark-ink: #3b3000;
    --ok: #178a55;
    --field: #ffffff;
    --soft: #e3ecfa;
    --shadow: 0 1px 0 rgba(20,33,61,.06), 0 10px 24px -12px rgba(20,33,61,.25);
    --sat: 62%; --lt: 40%; --bgl: 92%;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0c1322; --paper: #162036; --ink: #e8eefb; --muted: #9db0cf; --rule: #27385a;
      --cover: #0a1020; --cover-ink: #eef3ff; --margin: #ff6b7d; --mark: #e8c92a; --mark-ink: #2a2300;
      --ok: #4cc88d; --field: #101a2e; --soft: #1e2d4a; --shadow: 0 10px 24px -12px rgba(0,0,0,.6);
      --sat: 55%; --lt: 68%; --bgl: 24%;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: "Vazirmatn", "Noto Sans Arabic", Tahoma, system-ui, sans-serif; line-height: 1.9;
    padding-bottom: env(safe-area-inset-bottom);
  }
  main { max-width: 560px; margin: 0 auto; padding: 0 0 80px; }
  h1, h2, h3, p { margin: 0; }
  button { font: inherit; cursor: pointer; border: 0; color: inherit; background: none; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 3px solid var(--margin); outline-offset: 2px;
  }
  svg { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }

  #bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--mark); transform-origin: right; transform: scaleX(0); opacity: 0; transition: transform .6s ease, opacity .3s; z-index: 50; }
  body.busy #bar { opacity: 1; transform: scaleX(.8); }

  /* جلد دفتر */
  .cover {
    background: var(--cover); color: var(--cover-ink);
    padding: 16px 16px 30px; border-radius: 0 0 26px 26px; position: relative;
  }
  .cover::after {
    content: ""; position: absolute; inset-inline: 22px; bottom: 10px; height: 0;
    border-bottom: 2px dashed rgba(244,247,255,.25);
  }
  .cover-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; }
  .brand { font-weight: bold; font-size: 15px; opacity: .9; }
  .chip-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 99px;
    background: rgba(244,247,255,.12); color: var(--cover-ink); font-size: 14px;
  }
  .chip-btn:active { background: rgba(244,247,255,.25); }
  .label {
    background: #fbfdff; color: #14213d; border-radius: 6px; margin: 16px 6px 0; padding: 12px 16px 14px;
    box-shadow: 0 6px 0 -2px rgba(0,0,0,.25);
    background-image: repeating-linear-gradient(transparent 0 33px, #c9d8f0 33px 34px);
    background-position: 0 6px;
  }
  .label small { display: block; font-size: 13px; color: #5f6f8a; line-height: 1.5; }
  .label h1 { font-size: 26px; line-height: 1.5; word-break: break-word; }
  .label h1 mark { background: var(--mark); color: var(--mark-ink); padding: 0 8px; border-radius: 4px; }
  .sub { margin-top: 12px; font-size: 14px; opacity: .85; text-align: center; }

  .wrap { padding: 18px 14px 0; }

  /* دفتر (برگه‌ی خط‌دار با حاشیه‌ی قرمز) */
  .sheet {
    position: relative; background: var(--paper); border-radius: 6px 6px 14px 14px; box-shadow: var(--shadow);
    padding: 6px 0 4px; margin-top: 14px; overflow: hidden;
  }
  .sheet::before {
    content: ""; position: absolute; top: 0; bottom: 0; right: 52px; width: 2px; background: var(--margin); opacity: .55;
  }
  .day {
    display: flex; align-items: center; gap: 8px; padding: 12px 64px 4px 14px; font-weight: bold; font-size: 14px; color: var(--muted);
  }
  .day.today { color: var(--margin); }
  .day .n { background: var(--soft); border-radius: 99px; padding: 0 9px; font-size: 12px; color: var(--muted); }
  .entry {
    display: grid; grid-template-columns: 52px 1fr; align-items: start;
    border-bottom: 1px dashed var(--rule); padding: 10px 0 12px;
    --c: hsl(var(--h, 220) var(--sat) var(--lt));
    --cb: hsl(var(--h, 220) 70% var(--bgl));
  }
  .entry:last-child { border-bottom: 0; }
  .margin { display: flex; justify-content: center; padding-top: 4px; }
  .tick {
    width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--rule); display: grid; place-items: center;
    color: transparent; background: var(--paper);
  }
  .tick:active { transform: scale(.92); }
  .entry.done .tick { background: var(--ok); border-color: var(--ok); color: #fff; }
  .entry.done .body, .entry.done .subj { opacity: .5; }
  .entry.done .body { text-decoration: line-through; }
  .entry.past:not(.done) .when { text-decoration: line-through; }
  .content { padding: 0 14px 0 14px; min-width: 0; }
  .subj { display: inline-block; background: var(--cb); color: var(--c); font-weight: bold; border-radius: 5px; padding: 0 10px; border-inline-start: 4px solid var(--c); }
  .body { white-space: pre-wrap; margin: 4px 0 2px; word-break: break-word; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; font-size: 13px; }
  .when { color: var(--muted); }
  .when.hot { color: var(--margin); font-weight: bold; }
  .link { color: var(--c); font-weight: bold; text-decoration: none; display: inline-flex; gap: 4px; align-items: center; }
  .acts { display: flex; gap: 8px; margin-top: 8px; }

  .note {
    background: var(--mark); color: var(--mark-ink); border-radius: 4px; padding: 12px 16px; margin: 0 6px;
    transform: rotate(-.6deg); box-shadow: 0 8px 14px -10px rgba(0,0,0,.5);
  }
  .note b { display: block; font-size: 13px; opacity: .75; }
  .note p { white-space: pre-wrap; }

  /* پیشرفت */
  .progress { margin-top: 16px; }
  .progress .row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .track { height: 10px; background: rgba(244,247,255,.18); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; background: var(--mark); border-radius: 99px; transition: width .5s ease; }

  /* فیلترها */
  .seg { display: flex; background: var(--soft); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; padding: 6px 0; border-radius: 9px; font-size: 14px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: bold; box-shadow: 0 1px 3px rgba(20,33,61,.15); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex: none; padding: 3px 13px; border-radius: 99px; font-size: 14px; border: 2px solid var(--rule); background: var(--paper); color: var(--ink);
  }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chips.small button { font-size: 13px; padding: 0 11px; }

  /* فرم‌ها و دکمه‌ها */
  .panel { background: var(--paper); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; margin-top: 14px; }
  .panel h2 { font-size: 18px; margin-bottom: 2px; }
  label { display: block; font-size: 14px; margin: 12px 0 4px; color: var(--muted); }
  input, textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--field);
    border: 2px solid var(--rule); border-radius: 10px; padding: 9px 12px;
  }
  textarea { min-height: 92px; resize: vertical; }
  input.code { direction: ltr; text-align: center; font-size: 24px; letter-spacing: 6px; font-weight: bold; }
  .ltr { direction: ltr; text-align: left; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: bold; padding: 11px 20px; border-radius: 12px; background: var(--ink); color: var(--paper); }
  .btn.block { width: 100%; margin-top: 16px; }
  .btn.ghost { background: transparent; border: 2px solid var(--rule); color: var(--ink); }
  .btn.red { background: transparent; border: 2px solid var(--margin); color: var(--margin); }
  .btn.sm { padding: 3px 13px; font-size: 14px; border-radius: 8px; }
  .btn:active { transform: scale(.98); }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .row > * { flex: 1; }
  .tabs { display: flex; margin: 0 6px; gap: 6px; }
  .tabs button { flex: 1; padding: 10px; border-radius: 12px 12px 0 0; background: rgba(244,247,255,.1); color: var(--cover-ink); font-weight: bold; }
  .tabs button[aria-selected="true"] { background: var(--page); color: var(--ink); }
  .codebox { text-align: center; border: 2px dashed var(--rule); border-radius: 12px; padding: 10px; margin-top: 12px; }
  .codebox b { display: block; font-size: 34px; letter-spacing: 8px; direction: ltr; line-height: 1.4; }
  .muted { color: var(--muted); font-size: 14px; }
  .empty { text-align: center; padding: 34px 20px; color: var(--muted); }
  .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
  .choose { display: grid; gap: 12px; margin-top: 8px; }
  .choose button {
    text-align: start; padding: 16px; border-radius: 14px; background: var(--paper); box-shadow: var(--shadow);
    display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center;
  }
  .choose .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--mark); color: var(--mark-ink); font-size: 22px; }
  .choose b { font-size: 17px; display: block; }
  .choose small { color: var(--muted); }
  .banner { margin: 12px 14px 0; padding: 10px 14px; border-radius: 10px; background: var(--soft); color: var(--ink); font-size: 14px; border-inline-start: 4px solid var(--margin); }
  #toast {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translate(-50%, 30px);
    background: var(--ink); color: var(--paper); padding: 10px 20px; border-radius: 99px; font-size: 14px; max-width: 90%;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 60; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { background: var(--margin); color: #fff; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="bar"></div>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// ================= تنظیمات Supabase (این دو مقدار رو عوض کن) =================
const SUPABASE = {
  url: 'https://baulcrhlclcninkncfzq.supabase.co',
  key: 'sb_publishable_kubd6Fmvf8SPGchOAC5vSg_gwlmbhdb'
};

// ================= ذخیره‌سازی =================
const mem = {};
const configured = !SUPABASE.url.startsWith('PASTE') && !SUPABASE.key.startsWith('PASTE');
const API = SUPABASE.url.replace(/\/+$/, '') + '/rest/v1/classes';
const authHeaders = () => {
  const h = { apikey: SUPABASE.key };
  if (SUPABASE.key.startsWith('eyJ')) h.Authorization = 'Bearer ' + SUPABASE.key;
  return h;
};
const docId = key => key.replace(/[^a-zA-Z0-9]/g, '_');

const store = {
  async get(key, shared) {
    if (!shared) {
      try { const v = localStorage.getItem(key); if (v) return JSON.parse(v); } catch (e) {}
      return mem['local:' + key] ? JSON.parse(mem['local:' + key]) : null;
    }
    if (!configured) return mem[key] ? JSON.parse(mem[key]) : null;
    try {
      const r = await fetch(`${API}?id=eq.${docId(key)}&select=data`, { headers: authHeaders() });
      if (!r.ok) return null;
      const rows = await r.json();
      return rows.length ? rows[0].data : null;
    } catch (e) { return null; }
  },
  async set(key, val, shared) {
    if (!shared) {
      mem['local:' + key] = JSON.stringify(val);
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
      return true;
    }
    if (!configured) { mem[key] = JSON.stringify(val); return true; }
    try {
      const r = await fetch(`${API}?on_conflict=id`, {
        method: 'POST',
        headers: { ...authHeaders(), 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify({ id: docId(key), data: val })
      });
      return r.ok;
    } catch (e) { return false; }
  }
};

async function hash(s) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mashgh:' + s));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { return 'plain:' + s; }
}

// ================= ابزارها =================
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toFa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const normCode = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
const ALPHA = 'abcdefghjkmnpqrstuvwxyz23456789';
const genCode = () => Array.from({ length: 5 }, () => ALPHA[Math.floor(Math.random() * ALPHA.length)]).join('');
const val = id => (document.getElementById(id) || {}).value || '';
const DEFAULT_SUBJECTS = ['ریاضی', 'فارسی', 'علوم', 'اجتماعی', 'قرآن', 'انگلیسی'];

const IC = {
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg>',
  link: '<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>',
  refresh: '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 10-2.5 5.8"/><path d="M20 5v5h-5"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  out: '<svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/></svg>',
  pencil: '<svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 012.8 0l.2.2a2 2 0 010 2.8L8 19z"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  book: '<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/></svg>',
  teacher: '<svg viewBox="0 0 24 24"><path d="M3 5h18v11H3z"/><path d="M8 20h8M12 16v4"/><path d="M7 9h6M7 12h4"/></svg>'
};

function toast(text, err) {
  const t = document.getElementById('toast');
  t.textContent = text; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2600);
}

async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); return; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(okMsg); } catch (e) { toast('کپی نشد. دستی کپی کن: ' + text, true); }
  ta.remove();
}

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function dayDiff(d) {
  if (!d) return null;
  const [y, m, day] = d.split('-').map(Number);
  const now = new Date(); now.setHours(0, 0, 0, 0);
  return Math.round((new Date(y, m - 1, day) - now) / 86400000);
}
function faDate(d) {
  const [y, m, day] = d.split('-').map(Number);
  return new Date(y, m - 1, day).toLocaleDateString('fa-IR', { weekday: 'long', day: 'numeric', month: 'long' });
}
function whenText(d) {
  const df = dayDiff(d);
  if (df === null) return { t: '', hot: false };
  if (df < 0) return { t: 'مهلتش تموم شده (' + faDate(d) + ')', hot: false };
  if (df === 0) return { t: 'تحویل: امروز', hot: true };
  if (df === 1) return { t: 'تحویل: فردا', hot: true };
  return { t: 'تحویل: ' + faDate(d), hot: false };
}
const hueOf = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '';

function groupOf(h) {
  const df = dayDiff(h.due);
  if (df === null) return 5;
  if (df < 0) return 6;
  if (df === 0) return 1;
  if (df === 1) return 2;
  if (df <= 7) return 3;
  return 4;
}
const GROUP_NAMES = { 1: 'امروز', 2: 'فردا', 3: 'این هفته', 4: 'بعداً', 5: 'بدون مهلت', 6: 'مهلت‌های گذشته' };

const sortHw = list => [...list].sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || b.created - a.created);

// انجام‌شده‌ها فقط روی همین گوشی ذخیره میشن
const doneKey = code => 'done:' + code;
async function loadDone(code) { return new Set((await store.get(doneKey(code), false)) || []); }

// ================= وضعیت =================
let view = 'home', tab = 'login', session = null, cls = null, editId = null;
let studentCode = '', filter = 'all', subjFilter = '', doneSet = new Set(), lastCode = '', lastSync = 0;

function banner() {
  return configured ? '' : `<div class="banner">برنامه هنوز به دیتابیس وصل نشده، پس اطلاعات فقط تا بستن این صفحه می‌مونه. (دو مقدار بالای فایل رو پر کن.)</div>`;
}
function cover(inner, top) {
  return `<header class="cover">${top || ''}${inner}</header>`;
}
function topBar(backAct, right) {
  return `<div class="cover-top">
    ${backAct ? `<button class="chip-btn" data-act="${backAct}">${IC.back} بازگشت</button>` : `<span class="brand">دفتر مشق</span>`}
    ${right || ''}</div>`;
}

// ================= نمایش =================
function render() {
  ({ home: renderHome, student: renderStudent, teacherAuth: renderTeacherAuth, teacher: renderTeacher })[view]();
}

function renderHome() {
  $app.innerHTML = `
    ${cover(`<div class="label"><small>این دفتر مال کلاسه</small><h1>مشق‌های <mark>امروز</mark></h1></div>
             <p class="sub">معلم می‌نویسه، دانش‌آموز می‌بینه.</p>`, topBar())}
    ${banner()}
    <div class="wrap">
      <div class="choose">
        ${lastCode ? `<button data-act="open-last"><span class="ic">${IC.book}</span><span><b>برو به کلاس قبلی</b><small>کد: <span dir="ltr">${esc(lastCode)}</span></small></span></button>` : ''}
        <button data-act="go-student"><span class="ic">${IC.book}</span><span><b>من دانش‌آموزم</b><small>مشق‌ها رو ببین و تیک بزن</small></span></button>
        <button data-act="go-teacher"><span class="ic">${IC.teacher}</span><span><b>من معلمم</b><small>کلاس بساز و مشق بنویس</small></span></button>
      </div>
    </div>`;
}

function renderStudent() {
  if (!cls) {
    $app.innerHTML = `
      ${cover(`<div class="label"><small>کلاس‌ت رو پیدا کن</small><h1>کد <mark>کلاس</mark></h1></div>`, topBar('home'))}
      ${banner()}
      <div class="wrap"><div class="panel">
        <label for="code" style="margin-top:0">کدی که معلم بهت داده</label>
        <input id="code" class="code" maxlength="8" autocomplete="off" value="${esc(studentCode)}" placeholder="k7m2p">
        <button class="btn block" data-act="open-class">دیدن مشق‌ها</button>
      </div></div>`;
    return;
  }

  const all = sortHw(cls.homework);
  const active = all.filter(h => { const d = dayDiff(h.due); return d === null || d >= 0; });
  const doneActive = active.filter(h => doneSet.has(h.id)).length;
  const left = active.length - doneActive;
  const pct = active.length ? Math.round(doneActive / active.length * 100) : 0;

  const subjects = [...new Set(all.map(h => h.subject))];
  let list = all;
  if (subjFilter) list = list.filter(h => h.subject === subjFilter);
  if (filter === 'todo') list = list.filter(h => !doneSet.has(h.id));
  if (filter === 'done') list = list.filter(h => doneSet.has(h.id));

  const groups = {};
  list.forEach(h => (groups[groupOf(h)] = groups[groupOf(h)] || []).push(h));
  const sheet = Object.keys(groups).sort().map(g => `
    <div class="day ${g == 1 ? 'today' : ''}">${GROUP_NAMES[g]} <span class="n">${toFa(groups[g].length)}</span></div>
    ${groups[g].map(h => entry(h, false)).join('')}`).join('');

  const emptyMsg = !all.length
    ? ['هنوز مشقی ثبت نشده', 'وقتی معلم مشق بنویسه، همین‌جا میاد.']
    : filter === 'todo' ? ['همه‌ی مشق‌ها تموم شد', 'آفرین! می‌تونی به «همه» برگردی.']
    : ['چیزی پیدا نشد', 'فیلترها رو عوض کن.'];

  $app.innerHTML = `
    ${cover(`
      <div class="label"><small>دفتر مشق کلاس</small><h1>${esc(cls.name)}</h1></div>
      <div class="progress">
        <div class="row"><span>${active.length ? (left ? toFa(left) + ' مشق مونده' : 'همه‌ی مشق‌ها انجام شد') : 'مشق فعالی نیست'}</span><span>${active.length ? toFa(pct) + '٪' : ''}</span></div>
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      </div>`,
      topBar('change-class', `<button class="chip-btn" data-act="refresh">${IC.refresh} به‌روزرسانی</button>`))}
    ${banner()}
    <div class="wrap">
      ${cls.notice ? `<div class="note"><b>اطلاعیه‌ی معلم</b><p>${esc(cls.notice)}</p></div>` : ''}
      <div class="seg" style="margin-top:16px" role="group" aria-label="فیلتر وضعیت">
        <button data-act="filter" data-v="all" aria-pressed="${filter === 'all'}">همه</button>
        <button data-act="filter" data-v="todo" aria-pressed="${filter === 'todo'}">مونده</button>
        <button data-act="filter" data-v="done" aria-pressed="${filter === 'done'}">انجام‌شده</button>
      </div>
      ${subjects.length > 1 ? `<div class="chips" role="group" aria-label="فیلتر درس">
        <button data-act="subj" data-v="" aria-pressed="${!subjFilter}">همه‌ی درس‌ها</button>
        ${subjects.map(s => `<button data-act="subj" data-v="${esc(s)}" aria-pressed="${subjFilter === s}">${esc(s)}</button>`).join('')}
      </div>` : ''}
      ${list.length ? `<div class="sheet">${sheet}</div>` : `<div class="sheet"><div class="empty"><b>${emptyMsg[0]}</b>${emptyMsg[1]}</div></div>`}
      <p class="muted" style="text-align:center;margin-top:14px">تیک‌ها فقط روی همین گوشی ذخیره میشن.</p>
    </div>`;
}

function entry(h, teacher) {
  const w = whenText(h.due);
  const isDone = !teacher && doneSet.has(h.id);
  const past = dayDiff(h.due) !== null && dayDiff(h.due) < 0;
  const url = safeUrl(h.link || '');
  return `<div class="entry ${isDone ? 'done' : ''} ${past ? 'past' : ''}" style="--h:${hueOf(h.subject)}">
    <div class="margin">${teacher ? '' : `<button class="tick" data-act="toggle" data-id="${h.id}" aria-pressed="${isDone}" aria-label="انجام شد">${IC.check}</button>`}</div>
    <div class="content">
      <span class="subj">${esc(h.subject)}</span>
      <div class="body">${esc(h.text)}</div>
      <div class="meta">
        ${w.t ? `<span class="when ${w.hot ? 'hot' : ''}">${w.t}</span>` : ''}
        ${url ? `<a class="link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${IC.link} لینک</a>` : ''}
      </div>
      ${teacher ? `<div class="acts">
        <button class="btn ghost sm" data-act="edit" data-id="${h.id}">${IC.pencil} ویرایش</button>
        <button class="btn red sm" data-act="del" data-id="${h.id}">${IC.trash} حذف</button></div>` : ''}
    </div>
  </div>`;
}

function renderTeacherAuth() {
  $app.innerHTML = `
    ${cover(`<div class="label"><small>بخش معلم</small><h1>ورود <mark>معلم</mark></h1></div>
      <div class="tabs" style="margin-top:16px" role="tablist">
        <button role="tab" aria-selected="${tab === 'login'}" data-act="tab-login">ورود به کلاس</button>
        <button role="tab" aria-selected="${tab === 'create'}" data-act="tab-create">کلاس جدید</button>
      </div>`, topBar('home'))}
    ${banner()}
    <div class="wrap">
      <div class="panel" style="margin-top:0">
      ${tab === 'login' ? `
        <label for="tcode" style="margin-top:0">کد کلاس</label>
        <input id="tcode" class="code" maxlength="8" autocomplete="off">
        <label for="tpw">رمز معلم</label>
        <input id="tpw" type="password" autocomplete="current-password">
        <button class="btn block" data-act="login">ورود</button>` : `
        <label for="cname" style="margin-top:0">اسم کلاس</label>
        <input id="cname" maxlength="40" placeholder="مثلاً پنجم الف">
        <label for="cpw">رمز معلم (حداقل ۴ حرف)</label>
        <input id="cpw" type="password" autocomplete="new-password">
        <p class="muted" style="margin-top:8px">فقط با این رمز میشه مشق نوشت یا تغییر داد. یادت نره.</p>
        <button class="btn block" data-act="create">ساخت کلاس</button>`}
      </div>
    </div>`;
}

function renderTeacher() {
  const editing = editId ? cls.homework.find(h => h.id === editId) : null;
  const list = sortHw(cls.homework);
  const subjects = [...new Set([...cls.homework.map(h => h.subject), ...DEFAULT_SUBJECTS])];
  const link = shareLink(session.code);
  $app.innerHTML = `
    ${cover(`<div class="label"><small>دفتر مشق کلاس · معلم</small><h1>${esc(cls.name)}</h1></div>`,
      topBar(null, `<button class="chip-btn" data-act="logout">${IC.out} خروج</button>`))}
    ${banner()}
    <div class="wrap">
      <div class="panel" style="margin-top:0">
        <h2>کد کلاس</h2>
        <p class="muted">این کد یا لینک رو برای دانش‌آموزها بفرست.</p>
        <div class="codebox"><b>${esc(session.code)}</b></div>
        <div class="row">
          <button class="btn ghost" data-act="copy-code">${IC.copy} کپی کد</button>
          <button class="btn" data-act="copy-link">${IC.link} کپی لینک</button>
        </div>
      </div>

      <div class="panel" id="form">
        <h2>${editing ? 'ویرایش مشق' : 'مشق جدید'}</h2>
        <label for="subj">درس</label>
        <input id="subj" maxlength="40" value="${editing ? esc(editing.subject) : ''}">
        <div class="chips small">${subjects.map(s => `<button data-act="pick-subj" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>
        <label for="text">متن مشق</label>
        <textarea id="text" placeholder="مثلاً صفحه ۴۲ تمرین ۱ تا ۵">${editing ? esc(editing.text) : ''}</textarea>
        <label for="due">مهلت تحویل (اختیاری)</label>
        <input id="due" type="date" value="${editing ? esc(editing.due || '') : ''}">
        <div class="chips small">
          <button data-act="pick-due" data-d="0">امروز</button>
          <button data-act="pick-due" data-d="1">فردا</button>
          <button data-act="pick-due" data-d="3">۳ روز بعد</button>
          <button data-act="pick-due" data-d="7">هفته‌ی بعد</button>
          <button data-act="pick-due" data-d="">بدون مهلت</button>
        </div>
        <label for="link">لینک کمکی (اختیاری)</label>
        <input id="link" class="ltr" placeholder="https://" value="${editing ? esc(editing.link || '') : ''}">
        <div class="row">
          <button class="btn" data-act="save">${editing ? 'ذخیره تغییرات' : 'ثبت مشق'}</button>
          ${editing ? `<button class="btn ghost" data-act="cancel-edit">انصراف</button>` : ''}
        </div>
      </div>

      <div class="panel">
        <h2>اطلاعیه برای کلاس</h2>
        <p class="muted">بالای صفحه‌ی دانش‌آموزها نشون داده میشه.</p>
        <textarea id="notice" placeholder="مثلاً فردا امتحان املا داریم" style="margin-top:8px;min-height:70px">${esc(cls.notice || '')}</textarea>
        <div class="row"><button class="btn ghost" data-act="save-notice">ذخیره اطلاعیه</button></div>
      </div>

      <div class="day" style="padding:18px 4px 0;color:var(--ink)">مشق‌های ثبت‌شده <span class="n">${toFa(list.length)}</span></div>
      ${list.length ? `<div class="sheet" style="margin-top:6px">${list.map(h => entry(h, true)).join('')}</div>`
        : `<div class="sheet"><div class="empty"><b>هنوز مشقی ننوشتی</b>از فرم بالا اولین مشق رو ثبت کن.</div></div>`}
    </div>`;
}

function shareLink(code) {
  try { const u = new URL(location.href); u.search = ''; u.hash = ''; return u.toString() + '?c=' + code; }
  catch (e) { return code; }
}

// ================= داده =================
async function openClass(code, silent) {
  const data = await store.get('class:' + code, true);
  if (!data) {
    if (!silent) { cls = null; toast('کلاسی با این کد پیدا نشد. کد رو دوباره چک کن.', true); }
    return false;
  }
  cls = { ...data, code, homework: data.homework || [] };
  lastSync = Date.now();
  return true;
}

async function saveClass() {
  const { code, ...data } = cls;
  const ok = await store.set('class:' + code, data, true);
  if (!ok) toast('ذخیره نشد. اینترنت رو چک کن و دوباره امتحان کن.', true);
  return ok;
}

async function busy(fn) {
  document.body.classList.add('busy');
  try { return await fn(); } finally { document.body.classList.remove('busy'); }
}

async function enterStudent(code) {
  studentCode = code; view = 'student';
  if (await openClass(code)) {
    doneSet = await loadDone(code);
    lastCode = code; await store.set('last-code', code, false);
  }
  render();
}

// ================= کنش‌ها =================
const actions = {
  'home': () => { view = 'home'; cls = null; session = null; render(); },
  'go-student': () => { view = 'student'; cls = null; render(); },
  'go-teacher': () => { view = 'teacherAuth'; render(); },
  'change-class': () => { cls = null; render(); },
  'tab-login': () => { tab = 'login'; render(); },
  'tab-create': () => { tab = 'create'; render(); },
  'open-last': () => busy(() => enterStudent(lastCode)),

  'open-class': () => busy(async () => {
    const code = normCode(val('code'));
    if (!code) return toast('اول کد کلاس رو بنویس.', true);
    await enterStudent(code);
  }),
  'refresh': () => busy(async () => { if (await openClass(cls.code)) toast('به‌روز شد'); render(); }),
  'filter': el => { filter = el.dataset.v; render(); },
  'subj': el => { subjFilter = el.dataset.v; render(); },
  'toggle': async el => {
    const id = el.dataset.id;
    doneSet.has(id) ? doneSet.delete(id) : doneSet.add(id);
    await store.set(doneKey(cls.code), [...doneSet], false);
    render();
  },

  'create': () => busy(async () => {
    const name = val('cname').trim(), pw = val('cpw');
    if (!name) return toast('اسم کلاس رو بنویس.', true);
    if (pw.length < 4) return toast('رمز باید حداقل ۴ حرف باشه.', true);
    let code = genCode();
    for (let i = 0; i < 10 && (await store.get('class:' + code, true)); i++) code = genCode();
    cls = { code, name, pw: await hash(pw), homework: [], notice: '' };
    if (!(await saveClass())) { cls = null; return; }
    session = { code }; view = 'teacher';
    toast('کلاس ساخته شد. کد رو برای بچه‌ها بفرست.');
    render();
  }),

  'login': () => busy(async () => {
    const code = normCode(val('tcode')), pw = val('tpw');
    if (!code || !pw) return toast('کد کلاس و رمز رو بنویس.', true);
    if (!(await openClass(code))) return;
    if (cls.pw !== (await hash(pw))) { cls = null; return toast('رمز اشتباهه.', true); }
    session = { code }; view = 'teacher'; render();
  }),

  'logout': () => { session = null; cls = null; editId = null; view = 'home'; render(); },

  'copy-code': () => copyText(session.code, 'کد کپی شد'),
  'copy-link': () => copyText(shareLink(session.code), 'لینک کپی شد'),

  'pick-subj': el => { document.getElementById('subj').value = el.dataset.v; },
  'pick-due': el => {
    const d = el.dataset.d;
    if (d === '') { document.getElementById('due').value = ''; return; }
    const t = new Date(); t.setDate(t.getDate() + Number(d));
    document.getElementById('due').value = ymd(t);
  },

  'save': () => busy(async () => {
    const subject = val('subj').trim(), text = val('text').trim(), due = val('due');
    let link = val('link').trim();
    if (!subject || !text) return toast('درس و متن مشق رو بنویس.', true);
    if (link && !safeUrl(link)) { if (/^[\w.-]+\.[a-z]{2,}/i.test(link)) link = 'https://' + link; else return toast('لینک باید با https:// شروع بشه.', true); }
    await openClass(session.code, true);
    if (editId) {
      const h = cls.homework.find(x => x.id === editId);
      if (h) Object.assign(h, { subject, text, due, link });
    } else {
      cls.homework.push({ id: Date.now().toString(36), subject, text, due, link, created: Date.now() });
    }
    const wasEdit = !!editId;
    if (await saveClass()) { toast(wasEdit ? 'تغییرات ذخیره شد' : 'مشق ثبت شد'); editId = null; render(); }
  }),

  'edit': el => { editId = el.dataset.id; render(); document.getElementById('form').scrollIntoView(); },
  'cancel-edit': () => { editId = null; render(); },

  'del': el => busy(async () => {
    if (!confirm('این مشق حذف بشه؟')) return;
    await openClass(session.code, true);
    cls.homework = cls.homework.filter(h => h.id !== el.dataset.id);
    if (await saveClass()) toast('مشق حذف شد');
    render();
  }),

  'save-notice': () => busy(async () => {
    const notice = val('notice').trim();
    await openClass(session.code, true);
    cls.notice = notice;
    if (await saveClass()) toast(notice ? 'اطلاعیه ذخیره شد' : 'اطلاعیه پاک شد');
    render();
  })
};

$app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && actions[el.dataset.act]) actions[el.dataset.act](el);
});

// به‌روزرسانی خودکار صفحه‌ی دانش‌آموز هر ۶۰ ثانیه
setInterval(async () => {
  if (view !== 'student' || !cls || document.hidden) return;
  const before = JSON.stringify(cls);
  if (await openClass(cls.code, true) && JSON.stringify(cls) !== before) render();
}, 60000);

// ================= شروع =================
(async () => {
  lastCode = (await store.get('last-code', false)) || '';
  let c = '';
  try { c = normCode(new URLSearchParams(location.search).get('c') || ''); } catch (e) {}
  render();
  if (c) busy(() => enterStudent(c));
})();
</script>
</body>
</html>
